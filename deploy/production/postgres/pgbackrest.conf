[global]
# A local encrypted repository protects against an accidental pgdata-volume loss.
# Copy this repository off the VPS as documented in docs/production-vps-deployment.md.
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=3
# Keep PITR WAL since the latest differential backup; older retained backups
# remain restorable at their own backup point without retaining weeks of WAL.
repo1-retention-archive-type=diff
repo1-retention-archive=1
repo1-cipher-type=aes-256-cbc
start-fast=y
process-max=2
archive-async=y
spool-path=/var/lib/pgbackrest/spool
compress-level=1
log-level-console=info

[mock-kabu]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
