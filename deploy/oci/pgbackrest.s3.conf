# pgBackRest → OCI Object Storage (S3 호환 API). Always Free는 Object Storage 20GB.
# .env.production에 PGBACKREST_CONF=../oci/pgbackrest.s3.conf 를 두면 compose.oci.yml이 이 파일을 마운트하고,
# OCI_S3_ACCESS_KEY / OCI_S3_SECRET_KEY(고객 비밀 키)는 .env.production에 둔다.
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-bucket=mock-kabu2-backup
# <namespace>.compat.objectstorage.<region>.oraclecloud.com — 네임스페이스는 콘솔 > Object Storage > Bucket 정보
repo1-s3-endpoint=REPLACE_NAMESPACE.compat.objectstorage.ap-chuncheon-1.oraclecloud.com
repo1-s3-region=ap-chuncheon-1
repo1-s3-uri-style=path
# 키는 환경변수 PGBACKREST_REPO1_S3_KEY / PGBACKREST_REPO1_S3_KEY_SECRET 로 전달된다
repo1-retention-full=2
repo1-retention-diff=6
repo1-cipher-type=aes-256-cbc
start-fast=y
process-max=2
log-level-console=info

[mock-kabu]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
